<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Hind Siliguri',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:#05060d;
color:#fff;
overflow:hidden;

}

body::before{

content:"";
position:fixed;
width:100%;
height:100%;
top:0;
left:0;

background:

radial-gradient(circle at top,#18203d,#05060d 60%);

z-index:-2;

}

/* Floating Stars */

.stars{

position:fixed;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;

}

.star{

position:absolute;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;

}

@keyframes twinkle{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

}

}

/* Countdown */

#countdown{

position:fixed;
top:0;
left:0;
width:100%;
height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:20px;

background:#05060d;

z-index:9999;

}

#countdown h1{

font-size:40px;
color:#ffd700;

margin-bottom:20px;

}

#timer{

font-size:65px;
font-weight:bold;
margin:25px 0;

color:white;

}

#countdown p{

font-size:20px;
opacity:.8;
line-height:1.8;

}

/* Main */

#main{

display:none;

height:100vh;

overflow-y:auto;

}

/* Hero */

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:20px;

}

.hero h1{

font-size:55px;

color:#ffd700;

margin-bottom:20px;

}

.hero p{

font-size:22px;

max-width:700px;

line-height:2;

opacity:.9;

}

.nextBtn{

margin-top:40px;

padding:15px 45px;

border:none;

border-radius:40px;

font-size:18px;

cursor:pointer;

background:#ffd700;

font-weight:bold;

transition:.3s;

}

.nextBtn:hover{

transform:scale(1.05);

}

/* Music Button */

#musicBtn{

position:fixed;

bottom:20px;

right:20px;

width:60px;

height:60px;

border:none;

border-radius:50%;

background:#ffd700;

font-size:22px;

cursor:pointer;

z-index:999;

}

/* Section */

section{

min-height:100vh;

padding:100px 10%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

}

.title{

font-size:45px;

color:#ffd700;

margin-bottom:30px;

}

.text{

font-size:23px;

line-height:2.2;

max-width:850px;

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<!-- Background Music -->

<audio id="bgMusic" autoplay loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

<button id="musicBtn">

🔊

</button>

<!-- Countdown -->

<div id="countdown">

<h1>🎂 Birthday Surprise</h1>

<div id="timer">

00:00:00

</div>

<p>

আর একটু অপেক্ষা করো... ❤️<br>

আজ রাত <b>৮:২০</b> টায় একটি বিশেষ বার্তা খুলবে।

</p>

</div>

<!-- Main -->

<div id="main">

<section class="hero" id="step1">

<h1>🌙 শুরু...</h1>

<p>

আজ তোমার জন্য কিছু কথা জমিয়ে রেখেছি...

যদিও আজ আমরা আগের মতো নেই,

তবুও আজকের দিনটা তোমার।

তাই কিছু না বললেই নয়... ❤️

</p>

<button class="nextBtn"

onclick="goStep(2)">

পরের পৃষ্ঠা ➜

</button>

</section>

<script>

/* Stars */

const stars=document.getElementById("stars");

for(let i=0;i<180;i++){

let s=document.createElement("div");

s.className="star";

let size=Math.random()*3+1;

s.style.width=size+"px";

s.style.height=size+"px";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*3+"s";

stars.appendChild(s);

}

/* Music */

const music=document.getElementById("bgMusic");

const btn=document.getElementById("musicBtn");

btn.onclick=()=>{

if(music.paused){

music.play();

btn.innerHTML="🔊";

}else{

music.pause();

btn.innerHTML="🔇";

}

};

/* Countdown */

const end=new Date("July 29, 2026 20:20:00").getTime();

const done=localStorage.getItem("birthdayUnlocked");

function showMain(){

document.getElementById("countdown").style.display="none";

document.getElementById("main").style.display="block";

document.body.style.overflow="auto";

}

if(done=="yes"){

showMain();

}else{

setInterval(()=>{

let now=new Date().getTime();

let gap=end-now;

if(gap<=0){

localStorage.setItem("birthdayUnlocked","yes");

showMain();

return;

}

let h=Math.floor(gap/(1000*60*60));

let m=Math.floor((gap%(1000*60*60))/(1000*60));

let s=Math.floor((gap%(1000*60))/1000);

document.getElementById("timer").innerHTML=

String(h).padStart(2,"0")+":"+

String(m).padStart(2,"0")+":"+

String(s).padStart(2,"0");

},1000);

}

function goStep(n){

document.getElementById("step"+n).scrollIntoView({

behavior:"smooth"

});
  
}
  <!-- ================= STEP 2 ================= -->

<section id="step2">

<h2 class="title">💭 কিছু স্মৃতি...</h2>

<div class="card">

<p class="text">

এক সময় প্রতিদিন তোমার সাথে কথা হতো... 🌸<br><br>

সকালের "ঘুম থেকে উঠেছো?" থেকে রাতের "ঘুমাও" পর্যন্ত... 🌙<br><br>

ছোট ছোট অভিমান ছিল... 😊<br>
আবার একটু পরেই সব ঠিক হয়ে যেত... ❤️<br><br>

আজ সেই কথাগুলো শুধু স্মৃতি হয়ে আছে... 💫<br><br>

তবুও বিশ্বাস করো,<br>
সেই স্মৃতিগুলো এখনো আমার কাছে অনেক মূল্যবান। 🌼

</p>

</div>

<button class="nextBtn"

onclick="goStep(3)">

পরের পৃষ্ঠা ➜

</button>

</section>

<!-- ================= STEP 3 ================= -->

<section id="step3">

<h2 class="title">🌧️ কিছু সত্যি কথা</h2>

<div class="card">

<p class="text">

জানি... 💔<br><br>

আজ তুমি আর আমার জীবনের অংশ নও।<br><br>

হয়তো আমাদের গল্পটা এভাবেই শেষ হওয়ার ছিল... 🌙<br><br>

আমি কখনো তোমাকে দোষ দিইনি।<br>

কারণ ভালোবাসা কাউকে জোর করে ধরে রাখার নাম নয়। 🤍<br><br>

তুমি যেখানে থাকো,<br>

ভালো থেকো... 😊

</p>

</div>

<button class="nextBtn"

onclick="goStep(4)">

আরও পড়ো ➜

</button>

</section>

<style>

.card{

background:rgba(255,255,255,.05);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.08);

padding:35px;

border-radius:25px;

max-width:900px;

box-shadow:0 0 35px rgba(255,215,0,.08);

animation:fadeUp 1.2s;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(60px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/* Floating Hearts */

.heart{

position:fixed;

bottom:-50px;

font-size:20px;

animation:heartMove linear infinite;

pointer-events:none;

opacity:.7;

}

@keyframes heartMove{

0%{

transform:translateY(0) rotate(0deg);

}

100%{

transform:translateY(-120vh) rotate(360deg);

}

}

</style>

<script>

/* Floating Hearts */

for(let i=0;i<30;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=["❤️","🤍","✨"][Math.floor(Math.random()*3)];

h.style.left=Math.random()*100+"%";

h.style.fontSize=(15+Math.random()*20)+"px";

h.style.animationDuration=(8+Math.random()*8)+"s";

document.body.appendChild(h);

  }
  <!-- ================= STEP 4 ================= -->

<section id="step4">

<h2 class="title">🎂 শুভ জন্মদিন</h2>

<div class="card">

<p class="text" id="wishText"></p>

</div>

<button class="nextBtn"

onclick="goStep(5)">

শেষ পৃষ্ঠা ➜

</button>

</section>

<!-- ================= STEP 5 ================= -->

<section id="step5">

<h2 class="title">🌙 শেষ কিছু কথা...</h2>

<div class="card">

<p class="text">

হয়তো আমাদের গল্পটা এখানেই শেষ... 🌙<br><br>

কিন্তু তোমার জন্মদিনে তোমার জন্য আমার দোয়া কখনো শেষ হবে না। ❤️<br><br>

তুমি যেখানেই থাকো,<br>

অনেক ভালো থেকো... 😊<br><br>

আল্লাহ তোমার জীবনে সুখ, শান্তি আর সফলতা দান করুন। 🤲<br><br>

<strong>শুভ জন্মদিন...! 🎂🎉❤️</strong>

</p>

</div>

</section>

<footer>

Made With ❤️ Just For You

</footer>

<style>

footer{

padding:40px;

text-align:center;

font-size:18px;

opacity:.7;

background:#040404;

margin-top:50px;

}

</style>

<script>

/* Birthday Wish Typing */

const wish=

`🎉 শুভ জন্মদিন! 🎂

আজকের দিনটা শুধুই তোমার।

জানি,
আজ আমি তোমার জীবনের সেই মানুষটা নই...

হয়তো তুমি আমাকে ভুলে গেছো,
হয়তো নতুন গল্পে ব্যস্ত...

তবুও...
তোমার জন্য আমার দোয়া কখনো বদলাবে না। ❤️

আল্লাহ যেন তোমার প্রতিটি স্বপ্ন পূরণ করেন।
তোমার মুখের হাসিটা যেন সবসময় অটুট থাকে। 😊

তুমি ভালো থেকো...
অনেক অনেক ভালো থেকো।

🌸 শুভ জন্মদিন 🌸`;

let x=0;

function typingWish(){

if(x<wish.length){

document.getElementById("wishText").innerHTML+=wish.charAt(x);

x++;

setTimeout(typingWish,40);

}

}

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

typingWish();

observer.disconnect();

}

});

});

observer.observe(document.getElementById("step4"));

/* Fireworks */

setInterval(()=>{

let fire=document.createElement("div");

fire.innerHTML=["🎆","✨","🎉","💖"][Math.floor(Math.random()*4)];

fire.style.position="fixed";

fire.style.left=Math.random()*100+"%";

fire.style.top=Math.random()*80+"%";

fire.style.fontSize="35px";

fire.style.pointerEvents="none";

fire.style.transition="2s";

document.body.appendChild(fire);

setTimeout(()=>{

fire.style.transform="translateY(-180px) scale(2)";

fire.style.opacity="0";

},50);

setTimeout(()=>{

fire.remove();

},2000);

},2500);

</script>

</body>
</html>
